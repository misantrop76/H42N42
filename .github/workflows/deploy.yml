name: Deploy Game

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2

      - name: Install dependencies
        run: |
          opam install lwt js_of_ocaml js_of_ocaml-lwt -y
          opam install . --deps-only -y
      
      - name: Build
        run: |
          eval $(opam env)
          dune build

      - name: Prepare site
        run: |
          mkdir public

          cp index.html public/

          cp _build/default/main.bc.js public/

          if [ -d assets ]; then
            cp -r assets public/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4

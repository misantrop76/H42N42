<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H42N42</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #f5f7ed;
      background:
        radial-gradient(ellipse at top, #354c3b, #18251e 75%);
      overflow: auto;
    }

    #title {
      margin: 8px 0 0;
      font-size: clamp(32px, 5vw, 54px);
      font-weight: 900;
      letter-spacing: 7px;
      color: #a8f06b;
      text-shadow: 0 0 18px #73d94b66;
    }

    #subtitle {
      margin: 0 0 6px;
      color: #c5d5c2;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #start {
      padding: 13px 32px;
      border: 0;
      border-radius: 10px;
      color: #17301b;
      background: linear-gradient(135deg, #b6f779, #67d66c);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #347b40;
      transition: transform .15s, filter .15s;
    }

    #start:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    #start:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #347b40;
    }

    #game {
      width: min(1000px, 95vw);
      height: min(700px, 68vh);
      min-height: 400px;
      border: 4px solid #0e1912;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      isolation: isolate;
      background: #91c978;
      box-shadow:
        0 18px 50px #0007,
        inset 0 0 0 2px #ffffff20;
    }

    #game > div {
      flex-shrink: 0;
    }

    /* Zones visuelles : la rivière, le terrain et l'hôpital */
    .river-zone {
      background: linear-gradient(180deg, #42b9e9, #1676b8);
      border-bottom: 3px solid #d2f5ff;
    }

    .map-zone {
      background:
        radial-gradient(ellipse at 20% 30%, #ffffff18 0 2px, transparent 3px),
        radial-gradient(ellipse at 75% 65%, #ffffff18 0 2px, transparent 3px),
        linear-gradient(135deg, #a9df83, #6ebd69);
      background-size: 38px 38px, 48px 48px, auto;
    }

    .hospital-zone {
      background: linear-gradient(180deg, #f0f3e9, #cbd8c6);
      border-top: 4px solid #ffffff;
    }

    .creet {
      border: 2px solid #ffffffa8;
      box-shadow: 0 3px 7px #16321c66;
    }

    #footer {
      color: #b5c6b5;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px 5px;
      }

      #game {
        width: 98vw;
        height: 70vh;
        min-height: 350px;
      }

      #title {
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>
  <h1 id="title">H42N42</h1>
  <p id="subtitle">Survis. Soigne. Protège les Healthy.</p>

  <button id="start">▶ Lancer la partie</button>

  <div id="game"></div>

  <p id="footer">ÉVITE LA CONTAMINATION · UTILISE L'HÔPITAL</p>

  <script src="_build/default/main.bc.js"></script>
</body>
</html>

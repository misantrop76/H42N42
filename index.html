<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H42N42</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #f5f7ed;
      background:
        radial-gradient(ellipse at top, #354c3b, #18251e 75%);
      overflow: auto;
    }

    #title {
      margin: 8px 0 0;
      font-size: clamp(32px, 5vw, 54px);
      font-weight: 900;
      letter-spacing: 7px;
      color: #a8f06b;
      text-shadow: 0 0 18px #73d94b66;
    }

    #subtitle {
      margin: 0 0 6px;
      color: #c5d5c2;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }


    #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    padding: 20px 38px;
    min-width: 230px;

    border: 2px solid #c7ff9b;
    border-radius: 18px;

    color: #17301b;
    background: linear-gradient(135deg, #b6f779, #67d66c);

    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;

    cursor: pointer;
    box-shadow:
        0 0 20px #0267c566,
        0 8px 0 #0267c566,
        inset 0 1px 0 #ffffff99;

    transition: transform 0.2s ease, box-shadow 0.2s ease,
                filter 0.2s ease;
    }

    #start:hover {
    transform: translate(-50%, -53%) scale(1.05);
    filter: brightness(1.12);
    box-shadow:
        0 0 35px #8cff68aa,
        0 10px 0 #347b40,
        inset 0 1px 0 #ffffff99;
    }

    #start:active {
    transform: translate(-50%, -47%) scale(0.98);
    box-shadow:
        0 0 15px #8cff6866,
        0 3px 0 #347b40;
    }

    #start:focus-visible {
    outline: 3px solid white;
    outline-offset: 5px;
    }


    #game {
      width: min(1000px, 95vw);
      height: min(700px, 68vh);
      min-height: 400px;
      border: 4px solid #0e1912;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      isolation: isolate;
      background: #697265;
      box-shadow:
        0 18px 50px #0007,
        inset 0 0 0 2px #ffffff20;
    }

    #game > div {
      flex-shrink: 0;
    }

    /* Zones visuelles : la rivière, le terrain et l'hôpital */
    .river-zone {
      background: linear-gradient(180deg, #42b9e9, #1676b8);
      border-bottom: 3px solid #d2f5ff;
    }

    .map-zone {
      background:
        radial-gradient(ellipse at 20% 30%, #ffffff18 0 2px, transparent 3px),
        radial-gradient(ellipse at 75% 65%, #ffffff18 0 2px, transparent 3px),
        linear-gradient(135deg, #383f33, #465045);
      background-size: 38px 38px, 48px 48px, auto;
    }

    .hospital-zone {
      background: linear-gradient(180deg, #f0f3e9, #cbd8c6);
      border-top: 4px solid #ffffff;
    }

    .creet {
      border: 2px solid #ffffffa8;
      box-shadow: 0 3px 7px #16321c66;
    }

    #footer {
      color: #b5c6b5;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
    }


    #settings {
    width: min(1000px, 95vw);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    padding: 16px 20px;

    background: linear-gradient(135deg, #25392b, #18251e);
    border: 2px solid #435b45;
    border-radius: 12px;
    box-shadow: 0 8px 24px #0004;
    }

    .setting {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    }

    .setting label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: #e5efdf;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    }

    .setting label span {
    color: #a8f06b;
    white-space: nowrap;
    }

    .setting input[type="range"] {
    width: 100%;
    accent-color: #a8f06b;
    cursor: pointer;
    }

    .setting input[type="range"]:disabled {
    accent-color: #737d72;
    cursor: not-allowed;
    opacity: 0.45;
    }

    #settings:has(input:disabled) {
    filter: saturate(0.55);
    border-color: #3a453b;
    }

    @media (max-width: 600px) {
    #settings {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 14px;
    }
    }


    #score-panel {
    width: min(1000px, 95vw);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 12px 20px;

    background: linear-gradient(135deg, #25392b, #18251e);
    border: 2px solid #435b45;
    border-radius: 12px;
    box-shadow: 0 8px 24px #0004;
    }

    .score-label {
    color: #c5d5c2;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    }

    #score {
    color: #a8f06b;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 0 0 14px #73d94b66;
    font-variant-numeric: tabular-nums;
    }

    .score-description {
    color: #b5c6b5;
    font-size: 12px;
    }

    @media (max-width: 600px) {
    #score-panel {
        flex-wrap: wrap;
        gap: 8px 12px;
    }
    }


    @media (max-width: 600px) {
      body {
        padding: 10px 5px;
      }

      #game {
        width: 98vw;
        height: 70vh;
        min-height: 350px;
      }

      #title {
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>
    <h1 id="title">H42N42</h1>
    <p id="subtitle">Survive. Heal. Protect the Creets from radioactivity.</p>
    <div id="score-panel">
        <span class="score-label">🏆 BEST SCORE</span>
        <span id="score">0</span>
        <span class="score-description">Maximum healthy, live Creets</span>
    </div>
    <div id="game">
        <button id="start">
            <span style="font-size: 28px;">▶</span>
            <span>PLAY</span>
        </button>
    </div>
    <div id="settings">
        <div class="setting">
        <label for="speed">⚡ Speed <span id="speed-value">2.0</span></label>
        <input id="speed" type="range" min="1.5" max="3.0" step="0.1" value="2.0">
        </div>

        <div class="setting">
        <label for="size">● Size <span id="size-value">50 px</span></label>
        <input id="size" type="range" min="40" max="80" step="5" value="50">
        </div>

        <div class="setting">
        <label for="timeToDie">☠ Time to die <span id="time-value">1000</span></label>
        <input id="timeToDie" type="range" min="500" max="2000" step="100" value="1000">
        </div>
    </div>
    <p id="footer">AVOID CONTAMINATION · USE THE HOSPITAL TO TREAT THE SICK</p>

    <script src="_build/default/main.bc.js"></script>
</body>
</html>

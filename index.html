<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>H42N42</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #999b91;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #title {
        margin: 25px 0 15px 0;
        font-family: Arial, sans-serif;
        font-size: 42px;
        font-weight: bold;
        color: rgb(42, 196, 11);
        letter-spacing: 5px;
        text-shadow:
            0 3px 5px rgba(0, 0, 0, 0.5);
    }
    
    #start {
    margin-bottom: 15px;
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    }

    #game {
      width: 1000px;
      height: 700px;
      border: 4px solid #222;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <h1 id="title">H42N42</h1>
  <button id="start">Lancer le jeu</button>
  <div id="game"></div>
  <script src="main.bc.js"></script>
</body>
</html>
